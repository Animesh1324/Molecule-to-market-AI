name: Publish Docker images to GHCR

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects any tag whose repository path is not lowercase, and
      # github.repository_owner preserves the account's original casing
      # ("Animesh1324"). Lowercase it once here rather than in four tag strings.
      - name: Resolve lowercase image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/pharma-backend:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/pharma-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # NEXT_PUBLIC_* is inlined at build time, so the API base has to be
          # supplied here rather than at container start.
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.NEXT_PUBLIC_API_BASE || 'http://localhost:8000' }}
            NEXT_PUBLIC_APP_ENV=production
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/pharma-frontend:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/pharma-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
